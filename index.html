<!doctype html>
<html lang="hu">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f766e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Penzvalto" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Sajat penzvalto</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app">
      <section class="hero" aria-labelledby="app-title">
        <div>
          <p class="eyebrow">Sajat arfolyamokkal</p>
          <h1 id="app-title">Sajat penzvalto</h1>
        </div>
        <div class="status" id="installStatus">Bongeszo mod</div>
      </section>

      <section class="converter" aria-label="Penzvalto">
        <label for="amount">Osszeg</label>
        <input id="amount" type="number" inputmode="decimal" min="0" step="0.01" value="1000" />

        <div class="currency-row">
          <div>
            <label for="fromCurrency">Errol</label>
            <select id="fromCurrency"></select>
          </div>
          <button id="swapButton" type="button" aria-label="Penznemek felcserelese">⇄</button>
          <div>
            <label for="toCurrency">Erre</label>
            <select id="toCurrency"></select>
          </div>
        </div>

        <div class="result" aria-live="polite">
          <span>Atvaltott osszeg</span>
          <strong id="resultValue">-</strong>
        </div>
      </section>

      <section class="rates" aria-labelledby="rates-title">
        <div class="section-heading">
          <h2 id="rates-title">Arfolyamok</h2>
          <button id="refreshRates" type="button">Frissites</button>
        </div>
        <p class="hint" id="rateStatus">Az app indulas utan megprobalja automatikusan frissiteni az arfolyamokat.</p>
        <div id="ratesList" class="rates-list"></div>
        <button id="resetRates" class="secondary-action" type="button">Alap arfolyamok visszaallitasa</button>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
